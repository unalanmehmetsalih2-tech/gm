<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dil Değişimi</title>
<meta name="description" content="Dil pratiği yapmak için sohbet ve oyun uygulaması" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#2A46D6" />
<style>
:root{
  --cream:#FBF3E4; --card:#FFFFFF; --ink:#182449; --inkSoft:#5B6180;
  --cobalt:#2A46D6; --cobaltDeep:#1B32A6; --amber:#F5A83C; --amberDeep:#E8901A;
  --green:#3FAE6B; --red:#D9534F; --line:#EFE6D4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--cream);}
body{font-family:'Segoe UI', system-ui, -apple-system, sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
.app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;background:var(--cream);}
.hidden{display:none !important;}

.lang-pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 14px 8px 8px;box-shadow:0 1px 3px rgba(24,36,73,.08);}
.lang-badge{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}

.progress-card{border-radius:22px;padding:22px 18px;background:linear-gradient(120deg,#EAF1FF 0%,var(--cream) 55%,#FDEBD2 100%);border:1px solid var(--line);position:relative;overflow:hidden;}
.ring-wrap{display:flex;align-items:center;justify-content:center;position:relative;}
.ring-center{position:absolute;text-align:center;}
.ring-num{font-size:30px;font-weight:800;line-height:1;}
.ring-label{font-size:12px;font-weight:600;color:var(--inkSoft);margin-top:4px;}

.live-pill{display:flex;align-items:center;gap:6px;background:var(--card);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--inkSoft);box-shadow:0 1px 3px rgba(24,36,73,.06);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}

.match-btn{width:100%;border:none;border-radius:18px;padding:16px 18px;background:linear-gradient(135deg,var(--amber),var(--amberDeep));display:flex;align-items:center;gap:14px;box-shadow:0 8px 18px rgba(245,168,60,.35);}
.match-icon-circle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.match-text{text-align:left;flex:1;}
.match-title{font-weight:800;font-size:17px;color:#fff;}
.match-sub{font-size:12.5px;color:rgba(255,255,255,.9);font-weight:600;}

.mode-toggle{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:0 1px 3px rgba(24,36,73,.06);}
.mode-btn{flex:1;border:none;border-radius:10px;padding:9px 0;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;background:transparent;color:var(--inkSoft);}
.mode-btn.active{background:var(--cream);color:var(--ink);}

.section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.section-title{font-weight:800;font-size:16px;}
.see-all{font-weight:700;font-size:13px;color:var(--cobalt);border:none;background:none;}

.partners-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;}
.partner{text-align:center;flex-shrink:0;border:none;background:none;color:inherit;}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#DCEAFE 0%,#F7E7C6 100%);display:flex;align-items:center;justify-content:center;font-size:21.6px;flex-shrink:0;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);}
.partner-name{font-size:11.5px;font-weight:700;margin-top:6px;}
.say-hi-circle{width:48px;height:48px;border-radius:50%;border:2px dashed var(--cobalt);display:flex;align-items:center;justify-content:center;font-size:18px;background:none;}
.say-hi-label{font-size:11.5px;font-weight:700;color:var(--cobalt);margin-top:6px;}

.suggested-row{display:flex;gap:12px;}
.suggested-card{flex:1;background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(24,36,73,.06);border:none;text-align:left;color:inherit;}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;display:inline-block;}
.tag-green{background:#E7F6EC;color:var(--green);}
.tag-blue{background:#EAF1FF;color:var(--cobalt);}
.suggested-text{font-weight:700;font-size:13.5px;margin-top:10px;}

.topbar{padding:22px 20px 4px;}
.topbar-sub{font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--inkSoft);margin-bottom:2px;}
.topbar-title{font-size:30px;font-weight:800;letter-spacing:-.5px;}

.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(24,36,73,.06);color:var(--inkSoft);font-size:14px;font-weight:500;}

.pills-row{display:flex;gap:8px;overflow-x:auto;}
.pill{padding:9px 16px;border-radius:999px;border:none;font-size:13.5px;font-weight:700;white-space:nowrap;background:var(--card);color:var(--inkSoft);box-shadow:0 1px 2px rgba(24,36,73,.06);}
.pill.active{background:var(--cobalt);color:#fff;box-shadow:0 4px 10px rgba(42,70,214,.35);}

.tourney-card{border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--cobalt),var(--cobaltDeep));position:relative;overflow:hidden;}
.tourney-badges{display:flex;gap:8px;align-items:center;}
.badge-weekend{background:var(--amber);color:#fff;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;}
.live-soon{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#DCE5FF;}
.live-dot{width:6px;height:6px;border-radius:50%;background:#8FE3B0;display:inline-block;}
.tourney-title{font-weight:800;font-size:21px;color:#fff;margin-top:10px;line-height:1.25;}
.tourney-sub{font-size:13px;color:#C9D6FF;margin-top:8px;font-weight:500;}
.tourney-btn{margin-top:16px;background:#fff;border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13.5px;color:var(--cobalt);display:inline-flex;align-items:center;gap:6px;}

.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.game-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(24,36,73,.07);}
.game-thumb{height:90px;background:linear-gradient(135deg,#DCEAFE,#F4EAD0);position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;}
.online-tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;}
.game-body{padding:12px 12px 14px;}
.game-head{display:flex;justify-content:space-between;align-items:flex-start;}
.game-name{font-weight:800;font-size:14.5px;line-height:1.2;}
.diff-tag{font-size:9.5px;font-weight:800;color:#fff;padding:3px 7px;border-radius:999px;white-space:nowrap;margin-left:6px;}
.rating-row{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--inkSoft);}
.play-btn{width:100%;margin-top:10px;border:none;border-radius:12px;padding:9px 0;background:var(--cobalt);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;}

.chat-filters{display:flex;gap:6px;}
.chat-filter-btn{border:none;border-radius:12px;padding:9px 6px;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:4px;background:transparent;color:var(--inkSoft);flex:1;}
.chat-filter-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(24,36,73,.08);}

.active-badge{font-size:11.5px;font-weight:700;color:var(--green);background:#E7F6EC;padding:3px 9px;border-radius:999px;}

.conv-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 3px rgba(24,36,73,.06);width:100%;border:none;text-align:left;color:inherit;}
.conv-item.highlight{box-shadow:0 0 0 2px var(--cobalt),0 4px 10px rgba(42,70,214,.15);}
.conv-main{flex:1;min-width:0;}
.conv-top{display:flex;justify-content:space-between;}
.conv-name{font-weight:800;font-size:14.5px;}
.conv-time{font-size:11.5px;color:var(--inkSoft);font-weight:600;}
.conv-preview{font-size:13px;color:var(--inkSoft);margin-top:3px;font-weight:500;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conv-preview.missed{color:var(--red);}
.conv-badge{min-width:22px;height:22px;border-radius:11px;background:var(--cobalt);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.streak-banner{border-radius:18px;padding:16px;background:linear-gradient(120deg,#E7F6EC 0%,#EAF1FF 100%);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.streak-text{font-weight:700;font-size:13.5px;}
.new-match-btn{border:none;border-radius:999px;padding:8px 14px;background:var(--cobalt);color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;}

.bottom-nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:420px;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(24,36,73,.18);display:flex;padding:8px;gap:6px;z-index:20;}
.nav-btn{flex:1;border:none;background:transparent;border-radius:16px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--inkSoft);}
.nav-btn.active{background:var(--cobalt);color:#fff;}
.nav-label{font-size:11px;font-weight:700;}

.screen{display:none;padding-bottom:120px;}
#screen-chat-detail.screen{padding-bottom:0;}
#screen-wordrace.screen,#screen-wordrace-result.screen,#screen-charades.screen,#screen-charades-result.screen{padding-bottom:24px;}
.screen.active{display:block;}

/* Chat detail */
.chat-header{display:flex;align-items:center;gap:12px;padding:18px 16px;background:var(--card);position:sticky;top:0;z-index:5;box-shadow:0 1px 3px rgba(24,36,73,.06);}
.back-btn{border:none;background:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--ink);}
.chat-header-name{font-weight:800;font-size:16px;}
.chat-header-sub{font-size:11.5px;color:var(--green);font-weight:600;}
.call-icon-btn{border:none;background:var(--cream);color:var(--cobalt);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:6px;}
.call-overlay{position:fixed;inset:0;background:#0B1030;z-index:200;display:flex;flex-direction:column;}
.call-overlay-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:#fff;}
.call-overlay-title{font-weight:700;font-size:14px;}
.call-close-btn{border:none;background:rgba(255,255,255,.15);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.call-iframe-wrap{flex:1;position:relative;}
.call-iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.call-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:14px;}
.msg-list{padding:16px 16px 80px;display:flex;flex-direction:column;gap:10px;min-height:50vh;}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.35;}
.msg-them{align-self:flex-start;background:var(--card);color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(24,36,73,.06);}
.msg-me{align-self:flex-end;background:var(--cobalt);color:#fff;border-bottom-right-radius:4px;}
.msg-row{display:flex;}
.chat-input-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--card);padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 -2px 10px rgba(24,36,73,.08);z-index:20;}
.chat-input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;background:var(--cream);outline:none;color:var(--ink);}
.send-btn{border:none;background:var(--cobalt);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Matching overlay */
.overlay{position:fixed;inset:0;background:rgba(24,36,73,.55);display:flex;align-items:center;justify-content:center;z-index:100;}
.overlay-card{background:var(--card);border-radius:20px;padding:30px 26px;text-align:center;max-width:280px;}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--cobalt);margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-title{font-weight:800;font-size:16px;margin-bottom:4px;}
.overlay-sub{font-size:13px;color:var(--inkSoft);}

/* Games */
.game-screen{padding:20px;}
.game-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.game-back{border:none;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 1px 3px rgba(24,36,73,.06);}
.game-stat{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;box-shadow:0 1px 3px rgba(24,36,73,.06);}
.wr-card{background:var(--card);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 1px 4px rgba(24,36,73,.07);}
.wr-prompt-label{font-size:12px;font-weight:700;color:var(--inkSoft);letter-spacing:.4px;text-transform:uppercase;}
.wr-word{font-size:30px;font-weight:800;margin:10px 0 20px;}
.wr-input{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;text-align:center;outline:none;font-weight:700;}
.wr-input.correct{border-color:var(--green);background:#E7F6EC;}
.wr-input.wrong{border-color:var(--red);background:#FCE9E8;}
.wr-submit{width:100%;margin-top:14px;border:none;border-radius:14px;padding:13px 0;background:var(--cobalt);color:#fff;font-weight:800;font-size:14.5px;}
.wr-feedback{margin-top:12px;font-size:13.5px;font-weight:700;min-height:18px;}
.wr-feedback.correct{color:var(--green);}
.wr-feedback.wrong{color:var(--red);}

.ch-emoji{font-size:60px;text-align:center;margin:20px 0;}
.ch-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ch-choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;font-size:14px;text-align:center;}
.ch-choice.correct{border-color:var(--green);background:#E7F6EC;color:var(--green);}
.ch-choice.wrong{border-color:var(--red);background:#FCE9E8;color:var(--red);}

.result-card{background:var(--card);border-radius:20px;padding:34px 24px;text-align:center;box-shadow:0 1px 4px rgba(24,36,73,.07);}
.result-emoji{font-size:50px;margin-bottom:10px;}
.result-title{font-weight:800;font-size:20px;margin-bottom:6px;}
.result-score{font-size:38px;font-weight:800;color:var(--cobalt);margin:10px 0;}
.result-best{font-size:13px;color:var(--inkSoft);font-weight:600;margin-bottom:20px;}
.result-btn{width:100%;border:none;border-radius:14px;padding:13px 0;font-weight:800;font-size:14.5px;margin-top:10px;}
.result-btn.primary{background:var(--cobalt);color:#fff;}
.result-btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div style="padding:20px 20px 0;">
      <div class="lang-pill">
        <span class="lang-badge" style="background:var(--cobalt);">EN</span>
        <span style="font-weight:700;font-size:14px;">English</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B6180" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        <span class="lang-badge" style="background:var(--amber);">ES</span>
      </div>
    </div>

    <div style="padding:16px 20px 0;">
      <div class="progress-card">
        <div class="ring-wrap">
          <svg width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="64" fill="none" stroke="#E4DCC9" stroke-width="12"/>
            <circle id="ring-progress" cx="75" cy="75" r="64" fill="none" stroke="#2A46D6" stroke-width="12" stroke-linecap="round" transform="rotate(-90 75 75)"/>
          </svg>
          <div class="ring-center">
            <div class="ring-num" id="ring-num">13/20</div>
            <div class="ring-label">min today</div>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:center;margin-top:14px;">
      <div class="live-pill"><span class="dot"></span>1,284 learners live now</div>
    </div>

    <div style="padding:16px 20px 0;">
      <button class="match-btn" id="match-now-btn">
        <span class="match-icon-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#E8901A" stroke="#E8901A" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span class="match-text">
          <div class="match-title">Match Now</div>
          <div class="match-sub">Find a partner in Spanish</div>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>

    <div style="padding:14px 20px 0;">
      <div class="mode-toggle" id="mode-toggle">
        <button class="mode-btn active" data-mode="Video">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
          Video
        </button>
        <button class="mode-btn" data-mode="Voice">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          Voice
        </button>
        <button class="mode-btn" data-mode="Text">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Text
        </button>
      </div>
    </div>

    <div style="padding:22px 20px 0;">
      <div class="section-row">
        <span class="section-title">Recent Partners</span>
        <button class="see-all" data-nav="chats">See all</button>
      </div>
      <div class="partners-scroll" id="partners-scroll"></div>
    </div>

    <div style="padding:22px 20px 0;">
      <div class="section-title" style="margin-bottom:12px;">Suggested for you</div>
      <div class="suggested-row">
        <button class="suggested-card" data-nav="games">
          <span class="tag tag-green">POPULAR</span>
          <div class="suggested-text">Quick &amp; playful session</div>
        </button>
        <button class="suggested-card" id="quick-match-btn">
          <span class="tag tag-blue">LIVE</span>
          <div class="suggested-text">12 talking now</div>
        </button>
      </div>
    </div>
  </div>

  <!-- GAMES -->
  <div class="screen" id="screen-games">
    <div class="topbar"><div class="topbar-title">Games</div></div>

    <div style="padding:14px 20px 0;">
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B6180" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search games...
      </div>
    </div>

    <div style="padding:14px 20px 0;">
      <div class="pills-row" id="game-filters">
        <button class="pill a
